name: go-audit-lifecycle
services:
  service-db:
    image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    environment:
      POSTGRES_DB: lifecycle
      POSTGRES_USER: lifecycle
      POSTGRES_PASSWORD: lifecycle-local
    ports: ["127.0.0.1:55731:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecycle -d lifecycle"]
      interval: 2s
      timeout: 2s
      retries: 30
  broker:
    image: apache/kafka:4.4.0
    ports: ["127.0.0.1:19731:19731"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19731,CONTROLLER://:19732
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19731
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:19732
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19731 --list >/dev/null"]
      interval: 3s
      timeout: 10s
      retries: 40
