name: go-audit-configuration
services:
  requests-db:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: requests_app
      POSTGRES_PASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
    volumes:
      - requests-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U requests_app -d requests']
      interval: 2s
      timeout: 2s
      retries: 30
  checks-db:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: checks
      POSTGRES_USER: checks_app
      POSTGRES_PASSWORD: ${CHECKS_DB_PASSWORD:?set CHECKS_DB_PASSWORD}
    volumes:
      - checks-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U checks_app -d checks']
      interval: 2s
      timeout: 2s
      retries: 30
  site:
    image: go-audit-configuration:lesson
    build: .
    command: [-site]
    environment:
      LISTEN_ADDR: ':8090'
    healthcheck:
      test: [CMD, /probe, '127.0.0.1:8090']
      interval: 2s
      timeout: 2s
      retries: 30
  checks:
    image: go-audit-configuration:lesson
    build: .
    command: [-role, checks]
    environment:
      LISTEN_ADDR: ':8081'
      DATABASE_URL: postgres://checks_app:${CHECKS_DB_PASSWORD:?set CHECKS_DB_PASSWORD}@checks-db:5432/checks?sslmode=disable
      SITE_ORIGIN: http://site:8090
    depends_on:
      checks-db:
        condition: service_healthy
      site:
        condition: service_healthy
    networks:
      default:
        aliases:
          - checks-alt
    healthcheck:
      test: [CMD, /probe, '127.0.0.1:8081']
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: go-audit-configuration:lesson
    build: .
    command: [-role, api]
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    environment:
      LISTEN_ADDR: ':8080'
      DATABASE_URL: postgres://requests_app:${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}@requests-db:5432/requests?sslmode=disable
      CHECKS_URL: ${CHECKS_URL:-http://checks:8081}
      SITE_ORIGIN: http://site:8090
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      requests-db:
        condition: service_healthy
      checks:
        condition: service_healthy
    healthcheck:
      test: [CMD, /probe, '127.0.0.1:8080']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  requests-data:
  checks-data:
